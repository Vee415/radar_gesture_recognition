train:
  lr: 0.0005
  batch_size: 16
  epochs: 100
  scheduler: cosine
  weight_decay: 1.0e-4
  label_smoothing: 0.05
  early_stopping_patience: 15
  warmup_epochs: 5

model:
  name: cnn_lstm
  n_classes: 12
  input_size: 32
  cnn_backbone: cnn
  lstm_hidden_size: 512
  lstm_num_layers: 1
  lstm_dropout: 0.5
  fc_hidden_size: 256
  pretrained_cnn: null
  cnn_freeze_epochs: 10

temporal:
  seq_len: 40
  pad_mode: right

data:
  source: soli